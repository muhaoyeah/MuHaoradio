<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MuHao Radio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      user-select: none;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .startup-shell-mark {
      position: relative;
      z-index: 2;
      font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #fff;
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }
    .startup-warm-slit {
      position: absolute;
      inset: -25%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .startup-warm-slit::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140vmax;
      height: 1.4px;
      margin-left: -70vmax;
      margin-top: -0.7px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 28%,
        rgba(255, 255, 255, 0.05) 42%,
        rgba(255, 255, 255, 0.16) 50%,
        rgba(244, 210, 138, 0.07) 57%,
        rgba(255, 255, 255, 0) 70%,
        transparent 100%);
      box-shadow:
        0 0 10px 1px rgba(255, 255, 255, 0.06),
        0 0 28px 6px rgba(244, 210, 138, 0.03);
      transform: rotate(-34deg) translate3d(0, 0, 0);
      opacity: 0.35;
      animation: startup-warm-slit-breathe 7.5s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes startup-warm-slit-breathe {
      0%, 100% {
        opacity: 0.22;
        transform: rotate(-34deg) translate3d(-2%, 1.5%, 0);
      }
      50% {
        opacity: 0.55;
        transform: rotate(-34deg) translate3d(2%, -1.5%, 0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .startup-warm-slit::before {
        animation: none;
        opacity: 0.32;
        transform: rotate(-34deg);
      }
    }
  </style>
</head>
<body>
  <!-- MuHao outer shell layer-1 darkroom warm-up: black + MuHao@0.4 + weak slit breathe. No loading copy. -->
  <div class="startup-warm-slit" aria-hidden="true"></div>
  <div class="startup-shell-mark" aria-hidden="true">MuHao</div>
</body>
</html>
