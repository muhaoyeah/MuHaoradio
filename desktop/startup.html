<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MuHao Radio</title>
  <style>
    :root { color-scheme: dark; }
    /*
      Layer-1: ink-paper soak (Organic Premium).
      Soft center→out wash + feathered frontier; light scale/fade on the plate.
      Replaces hard outside→inside radial wipe. No RADIO. Vines untouched.
    */
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000;
    }
    body {
      user-select: none; cursor: default; position: relative;
      background: #000;
    }
    .plate {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: #050505 url("./assets/muhao-ink-startup.png") center / cover no-repeat;
      opacity: 0;
      transform: scale(0.985);
      transform-origin: 50% 48%;
    }
    #reveal {
      position: absolute; inset: 0; z-index: 1;
      width: 100%; height: 100%; pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .plate { opacity: 1 !important; transform: none !important; }
      #reveal { display: none; }
    }
  </style>
</head>
<body>
  <div class="plate" id="plate" role="img" aria-label="MuHao"></div>
  <canvas id="reveal" aria-hidden="true"></canvas>
  <script>
(function () {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var plate = document.getElementById("plate");
  var canvas = document.getElementById("reveal");
  if (reduce) {
    if (plate) {
      plate.style.opacity = "1";
      plate.style.transform = "none";
    }
    return;
  }
  if (!canvas || !plate) return;

  var ctx = canvas.getContext("2d", { alpha: true });
  if (!ctx) {
    plate.style.opacity = "1";
    plate.style.transform = "none";
    return;
  }

  var img = new Image();
  img.src = "./assets/muhao-ink-startup.png";

  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var W = 0, H = 0;
  var start = 0;
  var raf = 0;
  /* Main soak ~1.6s (within 1.2–1.8s); shell hold in main.js stays ≥3200ms */
  var DURATION = 1600;
  var EASE = function (t) {
    /* decelerate — premium enter, no overshoot */
    return 1 - Math.pow(1 - t, 3);
  };

  function resize() {
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawCover(scale) {
    if (!img.complete || !img.naturalWidth) {
      ctx.fillStyle = "#050505";
      ctx.fillRect(0, 0, W, H);
      return;
    }
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var cover = Math.max(W / iw, H / ih);
    var dw = iw * cover * scale, dh = ih * cover * scale;
    var dx = (W - dw) / 2, dy = (H - dh) / 2;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function frame(now) {
    if (!start) start = now;
    var t = Math.min(1, (now - start) / DURATION);
    var p = EASE(t);

    var cx = W * 0.5, cy = H * 0.48;
    var Rmax = Math.sqrt(cx * cx + Math.max(cy, H - cy) * Math.max(cy, H - cy)) * 1.08;
    /* Center → out soak radius */
    var r = Rmax * p;
    /* Wide feather so it never reads as a hard ring wipe */
    var band = Math.max(56, Math.min(W, H) * 0.16);
    /* Mark settle: 0.985 → 1 over the first ~40% of the soak */
    var markT = Math.min(1, p / 0.4);
    var markScale = 0.985 + 0.015 * (1 - Math.pow(1 - markT, 3));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    drawCover(markScale);
    /* Soft ink mask: opaque core, feathered rim */
    ctx.globalCompositeOperation = "destination-in";
    var inner = Math.max(0, r - band * 0.15);
    var outer = r + band;
    var g = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(0.55, "rgba(0,0,0,1)");
    g.addColorStop(0.82, "rgba(0,0,0,0.45)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    /* Warm paper catch — diffuse, not a stroked ellipse ring */
    if (r > 8 && t < 0.97) {
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      var warm = ctx.createRadialGradient(
        cx, cy, Math.max(0, r - band * 0.55),
        cx, cy, r + band * 0.25
      );
      warm.addColorStop(0, "rgba(236,224,196,0)");
      warm.addColorStop(0.55, "rgba(236,224,196,0.06)");
      warm.addColorStop(0.78, "rgba(236,224,196,0.14)");
      warm.addColorStop(1, "rgba(236,224,196,0)");
      ctx.fillStyle = warm;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    if (t < 1) {
      raf = requestAnimationFrame(frame);
    } else {
      plate.style.transition = "opacity .25s ease, transform .25s ease";
      plate.style.opacity = "1";
      plate.style.transform = "scale(1)";
      setTimeout(function () {
        ctx.clearRect(0, 0, W, H);
      }, 260);
    }
  }

  function boot() {
    resize();
    plate.style.opacity = "0";
    plate.style.transform = "scale(0.985)";
    start = 0;
    raf = requestAnimationFrame(frame);
  }

  window.addEventListener("resize", function () {
    resize();
  });

  if (img.complete && img.naturalWidth) boot();
  else {
    img.onload = boot;
    img.onerror = function () {
      plate.style.opacity = "1";
      plate.style.transform = "none";
    };
  }
})();
  </script>
</body>
</html>
